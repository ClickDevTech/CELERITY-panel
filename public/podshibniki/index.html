 if(r2<.14&&d&&SER[d.ser])return{c,o:pk(SER[d.ser],Object.values(SER)),a:SER[d.ser],p:`3-я цифра справа в ${n} — серия. Какая?`,e:`Цифра ${d.ser} = ${SER[d.ser]} серия.`};
 if(r2<.22&&kd)return{c,o:pk(KIND[d.kind],Object.values(KIND)),a:KIND[d.kind],p:`4-я цифра справа в ${n} — тип. Какой?`,e:`Цифра ${d.kind} = ${KIND[d.kind]}.`};
 if(r2<.32){const f=shuf(C.filter(x=>x!==c&&x.g===c.g&&x.full!==c.full))[0],t=Math.random()<.5,s=t?c:f;return{c,o:['Верно','Неверно'],a:t?'Верно':'Неверно',p:`${n} — ${s.full}. Верно?`,e:`${c.n}: ${c.full}.`}}
 if(r2<.4){const x=shuf(C.filter(x=>x.g!==c.g)).slice(0,3).map(x=>x.n);return{c,o:shuf([c.n,...x]),a:c.n,p:`Какой из этих номеров — ${G[c.g].toLowerCase()}?`,e:`${c.n}: ${c.full}.`}}
 if(r<.2&&d)return{c,o:bOpts(d.bore),a:d.bore+' мм',p:`Внутренний диаметр d у подшипника <b>${c.n}</b>?`,e:`Последние две цифры (${d.d2}) × 5 = ${d.bore} мм.`};
 if(r<.6||dup)return{c,o:opts(c,'full'),a:c.full,p:`Что за подшипник <b>${c.n}</b>?`};
 return{c,o:opts(c,'n'),a:c.n,p:`Какой номер у подшипника: <b>${c.full}</b>?`}}
function startLesson(n=10,weak=0){let p=[...C];if(weak){p=p.filter(c=>mm(c)<=1);if(p.length<6)p=[...C]}
 const pool=p.sort((a,b)=>mm(a)+Math.random()*1.5-mm(b)-Math.random()*1.5).slice(0,n);
 L={q:pool.map(mkQ),i:0,h:n>10?7:5,xp:0,ok:0,tot:0,ans:null,combo:0,max:0,miss:[]};lesson()}
function lesson(){const q=L.q[L.i],n=L.q.length;
 app.innerHTML=`<div class="row"><button class="chip" onclick="go('home')">✕</button><div class="bar" style="flex:1"><i style="width:${L.i/n*100}%"></i></div><b>❤️ ${L.h}</b></div>${L.combo>=2?`<div class="combo">🔥 комбо ×${L.combo}</div>`:''}
 <div class="q">${q.p}</div>${q.o.map((o,i)=>`<button class="opt ${L.ans==null?'':o===q.a?'ok':i===L.ans?'no':''}" onclick="ans(${i})" ${L.ans==null?'':'disabled'}><b>${i+1}.</b> ${o}</button>`).join('')}
 ${L.ans==null?'':fb(q)}`}
function fb(q){const ok=q.o[L.ans]===q.a,d=dec(q.c.n);
 const e=q.e||(d?`${q.c.n}: d = ${d.bore} мм, серия ${SER[d.ser]||d.ser}.`:'');
 return`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Верно! +10':'Правильно: '+q.a}</b><p>${e}</p><button class="big" onclick="nextQ()">ДАЛЬШЕ</button></div>`}
function ans(i){if(L.ans!=null)return;const q=L.q[L.i],ok=q.o[i]===q.a;L.ans=i;L.tot++;S.tot=(S.tot||0)+1;
 if(ok){L.ok++;S.cor=(S.cor||0)+1;L.combo++;L.max=Math.max(L.max,L.combo);L.xp+=10+(L.combo>=3?5:0);if(!q.re)S.m[q.c.n]=Math.min(4,mm(q.c)+1)}
 else{L.h--;L.combo=0;L.miss.push(q.c.n);if(!q.re){S.m[q.c.n]=Math.max(0,mm(q.c)-1);L.q.push({...q,re:1,o:shuf(q.o)})}}
 save();lesson()}
function nextQ(){L.ans=null;L.i++;if(L.h<=0)return end(false);if(L.i>=L.q.length)return end(true);lesson()}
function end(win){const t=new Date().toISOString().slice(0,10),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 const lv0=lvl();if(win){S.xp+=L.xp;S.les=(S.les||0)+1;S.best=Math.max(S.best||0,L.max);if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}}save();head();
 app.innerHTML=`<div class="card" style="text-align:center"><div class="num">${win?'ГОТОВО':'СТОП'}</div><p>${win?`+${L.xp} опыта, точность ${Math.round(L.ok/L.tot*100)}%`:'Сердца кончились. Загляни в «Разбор» и попробуй ещё.'}</p>${lvl()>lv0?`<p><b>🎉 Новый уровень ${lvl()}: ${TITLE()}</b></p>`:''}<p class="mut">Лучшее комбо ×${L.max}</p></div>${L.miss.length?`<div class="card"><b>Повтори эти номера:</b><div class="chips">${[...new Set(L.miss)].map(m=>`<span class="chip">${m}</span>`).join('')}</div></div>`:''}<button class="big" onclick="startLesson()">ЕЩЁ УРОК</button><p><button class="big" style="background:var(--card);color:var(--ink);border-color:var(--line)" onclick="go('home')">НА ГЛАВНУЮ</button></p>`}
addEventListener('keydown',e=>{if(tab!=='home'||!L||!$('.opt'))return;if(L.ans==null&&/^[1-4]$/.test(e.key))ans(+e.key-1);else if(L.ans!=null&&e.key==='Enter')nextQ()});

/* CARDS */
let K={g:-1,deck:[],i:0,f:0};
function deck(){K.deck=shuf(C.filter(c=>K.g<0||c.g===K.g)).sort((a,b)=>mm(a)-mm(b));K.i=0;K.f=0}
function cards(){if(!K.deck.length)deck();const c=K.deck[K.i];
 const chips=`<div class="chips">${['Все',...G].map((g,i)=>`<button class="chip ${K.g===i-1?'on':''}" onclick="K.g=${i-1};deck();cards()">${g}</button>`).join('')}</div>`;
 if(!c){app.innerHTML=chips+'<div class="card">Колода пройдена. 🎉</div><button class="big" onclick="deck();cards()">ЗАНОВО</button>';return}
 app.innerHTML=`${chips}<div class="row"><span class="mut">${K.i+1} / ${K.deck.length}</span><span>${[0,1,2,3].map(i=>`<span class="dot ${i<mm(c)?'f':''}"></span>`).join('')}</span></div>
 <div class="card flip" onclick="K.f=1;cards()" tabindex="0">${K.f?`<div class="mut">${G[c.g]}</div><div style="font:500 22px/1.3 var(--hd);margin:8px 0">${c.t}</div><small>d = ${dec(c.n)?.bore} мм</small>`:`<div class="num">${c.n}</div><small>нажми, чтобы проверить себя</small>`}</div>
 ${K.f?`<div class="two"><button onclick="rate(0)">😵 Не знал</button><button onclick="rate(1)">✅ Знал</button></div>`:''}`}
function rate(k){const c=K.deck[K.i];S.m[c.n]=k?Math.min(4,mm(c)+1):Math.max(0,mm(c)-1);save();if(!k)K.deck.push(c);K.i++;K.f=0;cards()}

/* GUIDE */
function dout(v){const d=dec(v),el=$('#dout');if(!d){el.innerHTML='<p class="mut">Введи номер, например 6206 или 11206.</p>';return}
 const s=d.s,L=d.L,ch=(x,c)=>x?`<span class="${c}">${x}</span>`:'';
 let iso='';if(L===4&&s[0]==='6'&&+s[1]<=4){const gs=({0:1,1:1,2:2,3:3,4:4})[s[1]]+s.slice(2);iso=`<div class="card"><b>Это международное (ISO) обозначение.</b> 6 — шариковый радиальный однорядный, ${s[1]} — серия, ${s.slice(2)} — d = ${d.bore} мм. По ГОСТ такой подшипник называется <b>${gs}</b>.</div>`}
 const hit=C.find(c=>c.n===v.trim().toUpperCase().replace(/Л$/,'Л'))||C.find(c=>c.n.replace(/\D/g,'')===s&&!/\D/.test(c.n));
 el.innerHTML=`${iso}<div class="digits">${[...s].map((x,i)=>{const p=L-i;return`<span class="${p<=2?'c1':p===3?'c2':p===4?'c3':'c4'}">${x}</span>`}).join('')}</div>
 <div class="leg"><span class="c1"><b>${d.d2}</b> d = ${d.bore} мм</span><span class="c2"><b>${d.ser}</b> серия: ${SER[d.ser]||'?'}</span>${L>=4?`<span class="c3"><b>${d.kind}</b> тип: ${KIND[d.kind]}</span>`:`<span class="c3"><b>0</b> (не пишется) ${KIND[0]}</span>`}${d.feat?`<span class="c4"><b>${d.feat}</b> особенности конструкции, ширина</span>`:''}</div>
 ${hit?`<div class="card"><b>${G[hit.g]}</b>, ${hit.t}</div>`:''}`}
function guide(){
 app.innerHTML=`<h2>Как читать номер</h2><p>Читай справа налево. Номер собирается из кусочков:</p>

 <div class="card"><div class="digits"><span class="c4">11</span><span class="c3">0</span><span class="c2">2</span><span class="c1">06</span></div><div class="leg" style="flex-direction:column"><span class="c1"><b>1–2 цифры справа:</b> диаметр отверстия d. От 04 и больше: число × 5 (06 → 30 мм). 00=10, 01=12, 02=15, 03=17 мм.</span><span class="c2"><b>3-я цифра:</b> серия по диаметру (насколько толстое кольцо).</span><span class="c3"><b>4-я цифра:</b> тип подшипника. Если её нет, тип 0 — шариковый радиальный.</span><span class="c4"><b>5–6 цифры и дальше:</b> конструктивные особенности (защита, канавка, втулка), а седьмая — ширина.</span></div></div>
 <h3>Попробуй сам</h3><input type="text" id="dinp" value="6206" inputmode="text" autocomplete="off" aria-label="Номер подшипника"><div id="dout"></div>
 <h3>Что значит 6206</h3><div class="card">Это международное обозначение: <b>6</b> — шариковый радиальный однорядный, <b>2</b> — лёгкая серия, <b>06</b> — отверстие 30 мм. По ГОСТ тот же подшипник называется просто <b>206</b>.</div>
 <h3>Серии (3-я цифра)</h3><div class="scroll"><table>${Object.entries(SER).map(([k,v])=>`<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join('')}</table></div>
 <h3>Типы (4-я цифра)</h3><div class="scroll"><table>${Object.entries(KIND).map(([k,v])=>`<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join('')}</table></div>
 <h3>Как запомнить</h3><div class="card"><p><b>Роликовые цилиндрические</b> почти всегда начинаются на 2 в 4-й позиции (2206, 12206, 32206): цифра 2 — ролики-цилиндры.</p><p><b>Конические</b> имеют 7 в 4-й позиции (7206, 27309, 97218): 7 — конус.</p><p><b>Радиально-упорные шариковые</b> имеют 6 (36206, 46206, 436208). <b>Упорные</b> — 8 (8206).</p><p><b>Закрытые:</b> 60 и 160 — защита с одной стороны, 80 и 180 — с двух (в 5–6 цифрах).</p><p class="mut">В таблице есть исключения, так что цифры дают подсказку, а точный ответ нужно заучить карточками.</p></div>
 <h3>Все номера</h3><input type="text" id="fs" placeholder="Поиск" style="font-size:18px" aria-label="Поиск по номеру"><div class="scroll"><table id="ft"></table></div>`;
 const ft=q=>$('#ft').innerHTML=C.filter(c=>c.n.toLowerCase().includes(q.toLowerCase())).map(c=>`<tr><td><b>${c.n}</b></td><td><small>${G[c.g]}</small><br>${c.t}</td></tr>`).join('');
 $('#dinp').oninput=e=>dout(e.target.value);$('#fs').oninput=e=>ft(e.target.value);ft('');dout('6206')}
go('home');
</script></body></html>
